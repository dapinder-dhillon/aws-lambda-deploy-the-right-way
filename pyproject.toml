[tool.poetry]
name = "create_presigned_url_lambda"
version = "0.0.0"
description = "This AWS Lambda function listens for S3 events, generates a pre-signed URL for accessing an object, and publishes it to an SNS topic. If any errors occur, it logs the issue and sends a Slack notification."
authors = ["https://medium.com/@dhillon.dapinder"]
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3.8",
    "Operating System :: OS Independent"
]

[tool.poetry.dependencies]
python = "^3.12"
requests = "2.32.3"

[tool.poetry.dev-dependencies]
boto3 = "^1.20.16"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
